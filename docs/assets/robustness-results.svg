<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Measured ball-to-bowl policy robustness</title>
  <desc id="desc">Success rates are 100 percent nominal and object pose, 95 percent camera, 100 percent background and lighting, and 90 percent combined.</desc>
  <rect width="960" height="390" rx="20" fill="#f6f8fa"/>
  <text x="480" y="43" fill="#24292f" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="600" text-anchor="middle">Robustness under controlled distribution shifts</text>
  <line x1="90" y1="78" x2="90" y2="310" stroke="#57606a" stroke-width="2"/>
  <line x1="90" y1="310" x2="905" y2="310" stroke="#57606a" stroke-width="2"/>
  <g stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 5">
    <line x1="90" y1="252" x2="905" y2="252"/>
    <line x1="90" y1="194" x2="905" y2="194"/>
    <line x1="90" y1="136" x2="905" y2="136"/>
    <line x1="90" y1="78" x2="905" y2="78"/>
  </g>
  <g fill="#57606a" font-family="Inter,Segoe UI,sans-serif" font-size="13">
    <text x="65" y="315">0</text><text x="56" y="257">25</text><text x="56" y="199">50</text><text x="56" y="141">75</text><text x="48" y="83">100</text>
    <text x="155" y="339" text-anchor="middle">ID</text>
    <text x="285" y="339" text-anchor="middle">Object pose</text>
    <text x="420" y="339" text-anchor="middle">Camera</text>
    <text x="555" y="339" text-anchor="middle">Background</text>
    <text x="690" y="339" text-anchor="middle">Lighting</text>
    <text x="835" y="339" text-anchor="middle">Combined</text>
  </g>
  <g fill="#2f81f7">
    <rect x="125" y="78" width="60" height="232" rx="5"/>
    <rect x="255" y="78" width="60" height="232" rx="5"/>
    <rect x="390" y="90" width="60" height="220" rx="5"/>
    <rect x="525" y="78" width="60" height="232" rx="5"/>
    <rect x="660" y="78" width="60" height="232" rx="5"/>
  </g>
  <rect x="805" y="101" width="60" height="209" rx="5" fill="#8250df"/>
  <g fill="#24292f" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <text x="155" y="70">20/20</text>
    <text x="285" y="70">20/20</text>
    <text x="420" y="82">19/20</text>
    <text x="555" y="70">20/20</text>
    <text x="690" y="70">20/20</text>
    <text x="835" y="93">18/20</text>
  </g>
  <text x="20" y="205" fill="#57606a" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 20 205)">Task success (%)</text>
  <text x="480" y="375" fill="#57606a" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle">Final 4,000-frame model · shared seed 6001 · 97/100 aggregate</text>
</svg>
