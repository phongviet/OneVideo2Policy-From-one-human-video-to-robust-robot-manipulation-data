project:
  name: onevideo2policy-two-path
  seed: 42

task:
  name: place
  source_object: ball
  target_object: bowl
  rigid_objects_only: true
  success:
    max_xy_error_m: 0.03
    max_height_error_m: 0.02

video:
  input: data/interim/hoi4d_ball_to_bowl_gate/manifest.json
  sample_fps: 5.0

tracking:
  segmenter: sam2
  point_tracker: cotracker3
  masks: data/interim/hoi4d_ball_to_bowl_gate/masks

paths:
  local:
    reconstruction: measured_primitives
    geometry: planar_mask_centroid_proxy
    robot_model: bounded_point_robot
    policy: ridge_behavior_cloning
    # HOI4D metric sequence audit: target values are direct object-pose
    # annotations. Source radius is the median robust RGB-D sphere fit.
    target_diameter_m: 0.09914989530909113
    target_height_m: 0.05693338151487156
    source_diameter_m: 0.03832122209971702
    source_radius_m: 0.01916061104985851
    # First depth-measurable source frame (87), during carry. The source begins
    # outside the camera view, so this is not a frame-zero separation.
    initial_separation_m: 0.579754419595432
    lift_height_m: 0.12
    randomization_m: 0.06
    train_episodes: 250
    eval_episodes: 100
    steps: 48
    min_success_rate: 0.80
  model_assisted:
    reconstruction: stabilityai/TripoSR
    reconstruction_mesh_resolution: 128
    reconstruction_chunk_size: 4096
    geometry: depth-anything/Depth-Anything-V2-Metric-Hypersim-Small
    geometry_input_size: 518
    metric_scale_reference: hoi4d_aligned_rgbd
    gaussian_scene: metric_rgbd_initialized_3d_gaussians
    gaussian_stride: 3
    gaussian_reference_frame: 89
    simulator: robosuite
    policy: visual_waypoint_temporal
    keyframes: 12
    min_vram_gb: 4
    recommended_vram_gb: 6
    status: completed_local_models

gates:
  min_mask_iou: 0.70
  min_track_survival: 0.80
