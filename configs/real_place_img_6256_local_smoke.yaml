# Systems baseline. Planar xy scale uses the measured 3 cm source diameter;
# remaining dimensions and vertical motion are provisional.
project:
  name: real-place-img-6256-local-smoke
  seed: 42

task:
  name: place
  source_object: round_container
  target_object: blue_case
  rigid_objects_only: true
  success:
    max_xy_error_m: 0.03
    max_height_error_m: 0.02

video:
  input: data/interim/real_place_img_6256/manifest.json
  sample_fps: 5.0

tracking:
  segmenter: sam2
  point_tracker: cotracker3
  min_visible_points: 12
  masks: data/interim/real_place_img_6256_perception/masks

paths:
  local:
    reconstruction: provisional_primitives
    geometry: camera_stabilized_planar_proxy
    camera_compensation: background_affine
    source_primitive: cylinder
    target_primitive: rectangular_tray
    robot_model: bounded_point_robot
    policy: ridge_behavior_cloning
    # Measured 2026-09-24: source diameter 3 cm, so radius is 1.5 cm.
    source_diameter_m: 0.03
    source_radius_m: 0.015
    # Replace the remaining scene quantities with actual measurements before metric use.
    target_diameter_m: 0.18
    target_length_m: 0.18
    target_width_m: 0.10
    target_height_m: 0.012
    source_height_m: 0.025
    lift_height_m: 0.12
    randomization_m: 0.06
    train_episodes: 250
    eval_episodes: 100
    steps: 48
    min_success_rate: 0.80
  model_assisted:
    reconstruction: stabilityai/TripoSR
    reconstruction_mesh_resolution: 128
    reconstruction_chunk_size: 4096
    geometry: depth-anything/Depth-Anything-V2-Metric-Hypersim-Small
    geometry_input_size: 518
    metric_scale_reference: measured_source_diameter
    simulator: robosuite
    policy: visual_waypoint_temporal
    keyframes: 12
    min_vram_gb: 4
    recommended_vram_gb: 6
    status: completed_local_models_geometry_uncalibrated

gates:
  min_mask_iou: 0.70
  min_track_survival: 0.80
