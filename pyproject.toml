[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onevideo2policy"
version = "0.1.0"
description = "A narrow reproduction of geometry-consistent robot demonstrations from one monocular video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OneVideo2Policy contributors" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
video = ["opencv-python>=4.9", "lzfse>=0.4.2", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ov2p = "onevideo2policy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onevideo2policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
